<title>Цветные игры Yandee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-height play screen (start → game), big targets, no scrolling. */
:root {
  color-scheme: light;
  --sky: #d9efff;
  --sky-deep: #b5dcfb;
  --ink: #23324a;
  --paper: #ffffff;
  --muted: #5b6b85;
  --red: #ec4a3a;    --red-d: #b8301f;    --red-l: #ff8a77;
  --yellow: #ffc929; --yellow-d: #d99a00; --yellow-l: #ffe27a;
  --blue: #2f7cf0;   --blue-d: #1b55b5;   --blue-l: #7db0ff;
  --green: #36b95a;  --green-d: #1f8a3c;  --green-l: #7fe09a;
  --orange: #ff8a1f; --orange-d: #c95f00; --orange-l: #ffb877;
  --purple: #9b5de5; --purple-d: #6c35b0; --purple-l: #c9a6f5;
  --pink: #ff7eb6;   --pink-d: #d14d8a;   --pink-l: #ffb8d6;
  --brown: #9a6337;  --brown-d: #6b3f1d;  --brown-l: #c99a6e;
  --lightblue: #6fd0f6; --lightblue-d: #2c9cc8; --lightblue-l: #b8ecff;
  --white: #fbfbf8;  --white-d: #8e98a4;  --white-l: #ffffff;
  --black: #34343f;  --black-d: #121219;  --black-l: #5c5c6c;
  --leaf: #3fae4f; --leaf-d: #23803a; --cone: #e3b46a; --cone-d: #b27f32; --stem: #7a4a1e;
  --display: "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--display);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.app {
  height: 100%; display: flex; flex-direction: column; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* ---------- start ---------- */
.home { justify-content: center; align-items: center; gap: 20px; }
.home h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); font-weight: 900; text-align: center; }
.start {
  border: 0; border-radius: 32px; padding: 18px 28px 22px; width: min(320px, 100%);
  background: var(--paper); color: var(--ink); font: 900 26px/1.1 var(--display);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  box-shadow: 0 6px 0 var(--sky-deep); cursor: pointer;
}
.start:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sky-deep); }
.start:focus-visible, .round:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
.start .pair { display: flex; width: 100%; }
.start .pair svg { flex: 1; min-width: 0; height: auto; }
.note { max-width: 44ch; margin: 0; text-align: center; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.4; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; }
.bar .spacer { flex: 1; }
.round {
  width: 56px; height: 56px; border-radius: 50%; border: 0; flex: none;
  background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 4px 0 var(--sky-deep);
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-deep); }
.round svg { width: 28px; height: 28px; }
.levels { display: flex; gap: 8px; align-items: center; }
.levels i { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--sky-deep); }
.levels { flex-wrap: wrap; justify-content: center; max-width: 60%; gap: 6px; }
.levels i { width: 12px; height: 12px; transition: transform .3s; }
.levels i.done { background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18); }
.levels i.now { background: var(--c); box-shadow: 0 0 0 3px var(--paper); transform: scale(1.35); }

/* ---------- monsters ---------- */
.monsters { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; }
.monster {
  width: calc(100% / var(--cols)); height: calc(100% / var(--rows));
  display: grid; place-items: center; cursor: pointer; touch-action: none; box-sizing: border-box; padding: 4px;
}
.monster svg { width: auto; height: 100%; max-width: 100%; max-height: 100%; overflow: visible; }
.monster.enter svg { animation: enter .7s cubic-bezier(.3,1.6,.5,1); }
.monster .m-open, .monster .m-yuck, .monster .m-chomp, .monster .eye-squint,
.start .m-open, .start .m-yuck, .start .m-chomp, .start .eye-squint { display: none; }
.monster.open .m-idle, .monster.yuck .m-idle, .monster.chomp .m-idle { display: none; }
.monster.open .m-open, .monster.yuck .m-yuck, .monster.chomp .m-chomp { display: inline; }
.monster.yuck .eye-open { display: none; }
.monster.yuck .eye-squint { display: inline; }
.monster.chomp svg { animation: chomp .45s ease; }
.monster.yuck svg { animation: shake .5s ease; }
.monster.giggle svg { animation: wobble .6s ease; }
.monster.dance svg { animation: dance .5s ease-in-out infinite alternate; }
.monster:nth-child(2n).dance svg { animation-delay: .2s; }
.pupil { transition: transform .15s; }
.arm { transform-box: view-box; }
.arm-l { transform-origin: 46px 132px; }
.arm-r { transform-origin: 154px 132px; }
.monster.clap .arm-l { animation: clap-l .9s ease-in-out; }
.monster.clap .arm-r { animation: clap-r .9s ease-in-out; }
.monster.dance .arm-l { animation: clap-l .9s ease-in-out infinite; }
.monster.dance .arm-r { animation: clap-r .9s ease-in-out infinite; }
.monster.wave .arm-r { animation: wave 1s ease-in-out; }
.monster.leave svg { animation: leave .7s ease-in forwards; }
.monster svg { transition: transform .3s; }

.tray {
  flex: none; height: clamp(84px, 16vh, 120px);
  background: var(--paper); border-radius: 28px;
  display: flex; align-items: center; justify-content: space-around; padding-inline: 8px;
  box-shadow: inset 0 -6px 0 var(--sky-deep);
}
.food { width: 22%; max-width: 92px; aspect-ratio: 1; display: grid; place-items: center; cursor: grab; touch-action: none; transition: transform .2s, opacity .2s; }
.food svg { width: 100%; height: 100%; }
.food.selected { transform: translateY(-10px) scale(1.15); animation: bob .6s ease-in-out infinite alternate; }
.food.gone { opacity: 0; pointer-events: none; }
.food.pop { animation: pop .35s ease; }
.floating { position: fixed; z-index: 50; pointer-events: none; width: 80px; height: 80px; margin: -40px 0 0 -40px; left: 0; top: 0; }
.floating svg { width: 100%; height: 100%; }

.confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 3px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
@keyframes chomp { 0%{transform:scale(1)} 30%{transform:scale(1.12,.9)} 60%{transform:scale(.95,1.08)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px) rotate(-3deg)} 40%{transform:translateX(8px) rotate(3deg)} 60%{transform:translateX(-6px)} 80%{transform:translateX(5px)} }
@keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }
@keyframes dance { from{transform:translateY(0) rotate(-4deg)} to{transform:translateY(-14px) rotate(4deg)} }
@keyframes enter { from{transform:scale(0) rotate(-20deg)} to{transform:scale(1) rotate(0)} }
@keyframes bob { from{transform:translateY(-6px) scale(1.15)} to{transform:translateY(-14px) scale(1.15)} }
@keyframes pop { from{transform:scale(.3)} to{transform:scale(1)} }
@keyframes clap-l { 0%,100%{transform:rotate(0)} 25%,65%{transform:rotate(-100deg)} 45%{transform:rotate(-70deg)} }
@keyframes clap-r { 0%,100%{transform:rotate(0)} 25%,65%{transform:rotate(100deg)} 45%{transform:rotate(70deg)} }
@keyframes wave { 0%,100%{transform:rotate(0)} 20%,60%{transform:rotate(-150deg)} 40%,80%{transform:rotate(-120deg)} }
@keyframes leave { 0%{transform:scale(1)} 30%{transform:translateY(-14px) scale(1.05)} 100%{transform:translateY(40px) scale(0) rotate(25deg); opacity:0} }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div class="app" id="app"></div>

<script>
'use strict';
/* Colors with every word form the voice needs: adjective by gender (m/f/n) and "to the … one" (dat). */
const COLORS = {
  red:       { m: 'красный',    f: 'красная',    n: 'красное',    dat: 'красному',    v: 0 },
  blue:      { m: 'синий',      f: 'синяя',      n: 'синее',      dat: 'синему',      v: 2 },
  yellow:    { m: 'жёлтый',     f: 'жёлтая',     n: 'жёлтое',     dat: 'жёлтому',     v: 1 },
  green:     { m: 'зелёный',    f: 'зелёная',    n: 'зелёное',    dat: 'зелёному',    v: 3 },
  orange:    { m: 'оранжевый',  f: 'оранжевая',  n: 'оранжевое',  dat: 'оранжевому',  v: 1 },
  purple:    { m: 'фиолетовый', f: 'фиолетовая', n: 'фиолетовое', dat: 'фиолетовому', v: 0 },
  pink:      { m: 'розовый',    f: 'розовая',    n: 'розовое',    dat: 'розовому',    v: 3 },
  brown:     { m: 'коричневый', f: 'коричневая', n: 'коричневое', dat: 'коричневому', v: 2 },
  lightblue: { m: 'голубой',    f: 'голубая',    n: 'голубое',    dat: 'голубому',    v: 0 },
  white:     { m: 'белый',      f: 'белая',      n: 'белое',      dat: 'белому',      v: 1 },
  black:     { m: 'чёрный',     f: 'чёрная',     n: 'чёрное',     dat: 'чёрному',     v: 3, ink: '#ffffff' },
};
for (const k in COLORS) Object.assign(COLORS[k], { c: `var(--${k})`, d: `var(--${k}-d)`, l: `var(--${k}-l)` });
// Always 4 monsters. Start with the 4 basic colors; each full monster leaves
// and the next, harder color from this list takes its place.
const ORDER = ['red', 'blue', 'yellow', 'green', 'orange', 'purple', 'pink', 'brown', 'lightblue', 'white', 'black'];
const HUNGER = 2;

const cap = s => s[0].toUpperCase() + s.slice(1);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= voice & sound ================= */
let ruVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    ruVoice = vs.find(v => /^ru/i.test(v.lang) && /Milena|Alena|female|жен/i.test(v.name)) || vs.find(v => /^ru/i.test(v.lang)) || null;
  } catch (_) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (_) {}
function say(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; if (ruVoice) u.voice = ruVoice;
    u.rate = 0.92; u.pitch = 1.25;
    speechSynthesis.speak(u);
  } catch (_) {}
}
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, { type = 'sine', to = null, vol = 0.18, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, delay = 0, vol = 0.25, freq = 900, type = 'bandpass') {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
  f.type = type; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const sfx = {
  chomp() { noise(.08, 0); noise(.08, .14); noise(.08, .28); },
  clap(times = 2) { for (let i = 0; i < times; i++) noise(.09, .2 + i * .36, .55, 1800, 'highpass'); },
  yuck() { tone(220, .35, { type: 'triangle', to: 110, vol: .2 }); tone(180, .3, { type: 'triangle', to: 90, vol: .12, delay: .1 }); },
  boing() { tone(300, .25, { to: 700 }); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .3, { type: 'triangle', vol: .14, delay: i * .13 })); },
};

/* ================= drawings ================= */
function monsterSVG(key) {
  const k = COLORS[key], variant = k.v, ink = k.ink || '#1c2335';
  const eyes = { 0: [[72, 88], [128, 88]], 1: [[100, 84]], 2: [[74, 86], [126, 86]], 3: [[66, 92], [100, 76], [134, 92]] }[variant];
  const er = variant === 1 ? 26 : variant === 3 ? 15 : 19;
  const extras = [
    `<path d="M58 40 L48 6 L78 30 Z M142 40 L152 6 L122 30 Z" fill="#fff6e8" stroke="${k.d}" stroke-width="4" stroke-linejoin="round"/>`,
    `<path d="M88 22 Q92 2 100 18 Q106 0 112 22" fill="${k.c}" stroke="${k.d}" stroke-width="4" stroke-linejoin="round"/>`,
    `<path d="M76 30 Q66 12 58 4 M124 30 Q134 12 142 4" stroke="${k.d}" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="58" cy="4" r="9" fill="${k.l}" stroke="${k.d}" stroke-width="4"/><circle cx="142" cy="4" r="9" fill="${k.l}" stroke="${k.d}" stroke-width="4"/>`,
    `<circle cx="34" cy="62" r="16" fill="${k.c}" stroke="${k.d}" stroke-width="4"/><circle cx="166" cy="62" r="16" fill="${k.c}" stroke="${k.d}" stroke-width="4"/>`,
  ][variant];
  const eyeOpen = eyes.map(([x, y]) => `<g class="eye-open"><circle cx="${x}" cy="${y}" r="${er}" fill="#fff" stroke="${k.d}" stroke-width="4"/><g class="pupil" data-r="${er * .35}"><circle cx="${x}" cy="${y}" r="${er * .5}" fill="#1c2335"/><circle cx="${x - er * .18}" cy="${y - er * .2}" r="${er * .17}" fill="#fff"/></g></g>`).join('');
  const eyeSquint = eyes.map(([x, y]) => `<path class="eye-squint" d="M${x - er * .7} ${y - er * .3} L${x + er * .4} ${y} L${x - er * .7} ${y + er * .35}" stroke="${ink}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  // Arms hang down-outwards; clapping swings both hands to meet in front of the belly.
  const arm = (side, sx, hx, hy) => `<g class="arm arm-${side}"><path d="M${sx} 132 L${hx} ${hy}" stroke="${k.d}" stroke-width="12" stroke-linecap="round"/><path d="M${sx} 132 L${hx} ${hy}" stroke="${k.c}" stroke-width="6" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="13" fill="${k.l}" stroke="${k.d}" stroke-width="4"/></g>`;
  return `<svg viewBox="-6 -10 212 212" aria-hidden="true">
    ${extras}
    <ellipse cx="66" cy="190" rx="24" ry="10" fill="${k.d}"/><ellipse cx="134" cy="190" rx="24" ry="10" fill="${k.d}"/>
    <path d="M100 26 C152 26 184 66 184 116 C184 164 148 190 100 190 C52 190 16 164 16 116 C16 66 48 26 100 26Z" fill="${k.c}" stroke="${k.d}" stroke-width="5"/>
    <ellipse cx="100" cy="152" rx="50" ry="32" fill="${k.l}" opacity=".55"/>
    <circle cx="54" cy="122" r="9" fill="#ff7aa8" opacity=".55"/><circle cx="146" cy="122" r="9" fill="#ff7aa8" opacity=".55"/>
    ${eyeOpen}${eyeSquint}
    <g class="mouth">
      <path class="m-idle" d="M76 124 Q100 146 124 124" stroke="${ink}" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g class="m-open"><ellipse cx="100" cy="134" rx="28" ry="24" fill="#5b1730"/><ellipse cx="100" cy="146" rx="16" ry="8" fill="#ff7a92"/><path d="M84 114 l5 9 l5 -9 M106 114 l5 9 l5 -9" fill="#fff"/></g>
      <path class="m-chomp" d="M68 120 Q100 158 132 120 Z" fill="#5b1730" stroke="${ink}" stroke-width="5" stroke-linejoin="round"/>
      <g class="m-yuck"><path d="M70 130 q8 -8 15 0 t15 0 t15 0 t15 0" stroke="${ink}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M96 132 q6 22 16 4" fill="#ff7a92" stroke="#c84a64" stroke-width="3"/></g>
    </g>
    ${arm('l', 46, 18, 180)}${arm('r', 154, 182, 180)}
    <ellipse class="mouth-target" cx="100" cy="132" rx="1" ry="1" fill="none"/>
  </svg>`;
}

/* Food: name + grammatical gender (for "красная клубника" / "красный помидор" / "синее мороженое"). */
const S = 'stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const candy = key => `<path d="M28 50 L6 34 L10 50 L6 66 Z M72 50 L94 34 L90 50 L94 66 Z" fill="var(--${key}-l)" stroke="var(--${key}-d)" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="50" r="25" fill="var(--${key})" stroke="var(--${key}-d)" stroke-width="4"/><path d="M36 42 Q44 32 56 34" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>`;
const lolly = key => `<path d="M50 54 L50 96" stroke="#e9dcc4" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="36" r="30" fill="var(--${key})" stroke="var(--${key}-d)" stroke-width="4"/><path d="M50 36 m-4 0 a4 4 0 1 1 8 0 a9 9 0 1 1 -17 0 a14 14 0 1 1 27 0 a19 19 0 1 1 -37 0" stroke="var(--${key}-l)" stroke-width="4" fill="none" stroke-linecap="round"/>`;
const scoop = key => `<path d="M30 50 L50 94 L70 50Z" fill="var(--cone)" stroke="var(--cone-d)" ${S}/><path d="M38 58 L60 74 M44 52 L64 66 M56 52 L40 68" stroke="var(--cone-d)" stroke-width="2.5"/><circle cx="50" cy="38" r="24" fill="var(--${key})" stroke="var(--${key}-d)" stroke-width="4"/><path d="M28 48 q6 8 12 0 q6 8 12 0 q6 8 12 0 q6 8 10 0" fill="var(--${key})" stroke="var(--${key}-d)" stroke-width="4" stroke-linejoin="round"/><circle cx="42" cy="30" r="5" fill="#fff" opacity=".5"/>`;
const SWEETS = key => [
  { name: 'конфета', g: 'f', svg: candy(key) },
  { name: 'леденец', g: 'm', svg: lolly(key) },
  { name: 'мороженое', g: 'n', svg: scoop(key) },
];
const FOODS = {
  pink: [
    { name: 'пончик', g: 'm', svg: `<circle cx="50" cy="52" r="38" fill="#e3b46a" stroke="#b27f32" stroke-width="4"/><path d="M50 18 C72 18 86 32 86 48 C80 56 76 50 70 58 C64 66 58 58 50 62 C42 58 36 66 30 58 C24 50 20 56 14 48 C14 32 28 18 50 18Z" fill="var(--pink)" stroke="var(--pink-d)" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="50" r="11" fill="var(--sky)" stroke="#b27f32" stroke-width="4"/>${[[30,34,'#fff'],[62,30,'#ffe27a'],[70,44,'#7db0ff'],[36,48,'#7fe09a'],[52,30,'#fff']].map(([x,y,c])=>`<rect x="${x}" y="${y}" width="8" height="3" rx="1.5" fill="${c}" transform="rotate(${x*7} ${x+4} ${y+1})"/>`).join('')}` },
  ],
  brown: [
    { name: 'шоколадка', g: 'f', svg: `<rect x="18" y="14" width="64" height="76" rx="6" fill="var(--brown)" stroke="var(--brown-d)" ${S}/>${[0,1].map(c=>[0,1,2].map(r=>`<rect x="${26+c*26}" y="${22+r*22}" width="20" height="16" rx="3" fill="var(--brown-l)" opacity=".55"/>`).join('')).join('')}<path d="M18 62 L82 50 L82 90 L18 90Z" fill="#e9e2d6" stroke="#b9ad99" stroke-width="3" stroke-linejoin="round"/>` },
    { name: 'печенье', g: 'n', svg: `<circle cx="50" cy="50" r="38" fill="var(--brown-l)" stroke="var(--brown-d)" ${S}/>${[[36,36],[60,32],[66,56],[42,62],[54,48],[30,54],[56,72]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="var(--brown-d)"/>`).join('')}` },
  ],
  white: [
    { name: 'яйцо', g: 'n', svg: `<path d="M50 10 C72 10 86 46 86 62 C86 82 70 94 50 94 C30 94 14 82 14 62 C14 46 28 10 50 10Z" fill="var(--white)" stroke="var(--white-d)" ${S}/><ellipse cx="36" cy="44" rx="6" ry="12" fill="#e8ecef" transform="rotate(20 36 44)"/>` },
    { name: 'молоко', g: 'n', svg: `<path d="M26 12 H74 L68 92 H32Z" fill="#eef6fb" stroke="var(--white-d)" ${S}/><path d="M29 34 H71 L67 88 H33Z" fill="var(--white)"/><path d="M29 34 q10 -6 21 0 t21 0" stroke="#dfe5ea" stroke-width="3" fill="none"/>` },
  ],
  black: [
    { name: 'ежевика', g: 'f', svg: `${[[38,40],[52,36],[66,42],[34,56],[48,52],[62,56],[42,70],[56,70],[50,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10" fill="var(--black)" stroke="var(--black-d)" stroke-width="3"/><circle cx="${x-3}" cy="${y-3}" r="2.5" fill="#fff" opacity=".45"/>`).join('')}<path d="M40 26 L52 14 L64 26 L52 30Z" fill="var(--leaf)" stroke="var(--leaf-d)" stroke-width="3" stroke-linejoin="round"/>` },
  ],
  red: [
    { name: 'клубника', g: 'f', svg: `<path d="M50 92 C22 72 12 48 22 34 C32 22 44 28 50 32 C56 28 68 22 78 34 C88 48 78 72 50 92Z" fill="var(--red)" stroke="var(--red-d)" ${S}/>${[[38,46],[56,44],[46,60],[64,60],[36,64],[54,76]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="2.5" ry="4" fill="#ffe27a"/>`).join('')}<path d="M32 30 L44 24 L50 14 L56 24 L68 30 L56 34 L50 30 L44 34Z" fill="var(--leaf)" stroke="var(--leaf-d)" stroke-width="3" stroke-linejoin="round"/>` },
    { name: 'помидор', g: 'm', svg: `<circle cx="50" cy="56" r="34" fill="var(--red)" stroke="var(--red-d)" ${S}/><ellipse cx="36" cy="46" rx="6" ry="10" fill="#fff" opacity=".4" transform="rotate(25 36 46)"/><path d="M50 26 L40 18 L46 28 L32 28 L46 32 L42 40 L50 33 L58 40 L54 32 L68 28 L54 28 L60 18Z" fill="var(--leaf)" stroke="var(--leaf-d)" stroke-width="3" stroke-linejoin="round"/>` },
  ],
  blue: [
    { name: 'черника', g: 'f', svg: `${[[36,60],[64,60],[50,38]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="20" fill="var(--blue)" stroke="var(--blue-d)" stroke-width="4"/><path d="M${x-5} ${y-12} l5 4 l5 -4" stroke="var(--blue-d)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="${x-8}" cy="${y+2}" r="4" fill="#fff" opacity=".45"/>`).join('')}` },
  ],
  yellow: [
    { name: 'банан', g: 'm', svg: `<path d="M14 26 C20 70 58 90 90 70 C93 64 89 61 84 63 C58 74 34 58 28 26 C26 20 16 20 14 26Z" fill="var(--yellow)" stroke="var(--yellow-d)" ${S}/><path d="M14 26 L12 18" stroke="var(--stem)" stroke-width="6" stroke-linecap="round"/><path d="M30 40 C36 58 52 68 72 70" stroke="var(--yellow-d)" stroke-width="3" fill="none" opacity=".6"/>` },
    { name: 'сыр', g: 'm', svg: `<path d="M10 66 L84 30 L92 40 L92 80 L10 80Z" fill="var(--yellow)" stroke="var(--yellow-d)" ${S}/><path d="M10 66 L92 40" stroke="var(--yellow-d)" stroke-width="3"/><circle cx="40" cy="70" r="6" fill="var(--yellow-d)" opacity=".55"/><circle cx="70" cy="62" r="8" fill="var(--yellow-d)" opacity=".55"/><circle cx="82" cy="74" r="4" fill="var(--yellow-d)" opacity=".55"/><circle cx="58" cy="44" r="4" fill="var(--yellow-d)" opacity=".55"/>` },
  ],
  green: [
    { name: 'огурец', g: 'm', svg: `<rect x="10" y="36" width="80" height="30" rx="15" fill="var(--green)" stroke="var(--green-d)" ${S} transform="rotate(-20 50 51)"/>${[[30,58],[46,50],[62,44],[74,38],[38,64],[56,56]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.5" fill="var(--green-l)"/>`).join('')}` },
    { name: 'груша', g: 'f', svg: `<path d="M50 18 C60 18 62 32 63 40 C82 52 84 90 50 92 C16 90 18 52 37 40 C38 32 40 18 50 18Z" fill="var(--green)" stroke="var(--green-d)" ${S}/><path d="M50 18 Q50 10 56 6" stroke="var(--stem)" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="38" cy="62" rx="6" ry="11" fill="#fff" opacity=".35"/>` },
  ],
  orange: [
    { name: 'апельсин', g: 'm', svg: `<circle cx="50" cy="54" r="36" fill="var(--orange)" stroke="var(--orange-d)" ${S}/>${[[38,44],[58,40],[48,60],[66,62],[34,66],[60,78]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="var(--orange-d)" opacity=".6"/>`).join('')}<path d="M50 18 Q64 6 74 16 Q62 26 50 18Z" fill="var(--leaf)" stroke="var(--leaf-d)" stroke-width="3"/>` },
    { name: 'морковка', g: 'f', svg: `<path d="M50 94 L30 34 C36 26 64 26 70 34Z" fill="var(--orange)" stroke="var(--orange-d)" ${S}/><path d="M38 46 h10 M44 60 h10 M46 74 h7" stroke="var(--orange-d)" stroke-width="3" stroke-linecap="round"/><path d="M50 30 L38 8 M50 30 L50 4 M50 30 L62 8" stroke="var(--leaf)" stroke-width="7" stroke-linecap="round"/>` },
  ],
  purple: [
    { name: 'виноград', g: 'm', svg: `${[[36,36],[54,36],[72,36],[44,52],[62,52],[52,68],[40,68],[64,68],[52,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="11" fill="var(--purple)" stroke="var(--purple-d)" stroke-width="3"/><circle cx="${x-3}" cy="${y-3}" r="3" fill="#fff" opacity=".4"/>`).join('')}<path d="M54 25 Q56 12 66 8" stroke="var(--stem)" stroke-width="5" fill="none" stroke-linecap="round"/>` },
    { name: 'баклажан', g: 'm', svg: `<path d="M66 26 C88 40 92 76 70 88 C48 98 18 84 14 66 C10 50 30 46 44 40 C54 36 58 22 66 26Z" fill="var(--purple)" stroke="var(--purple-d)" ${S}/><path d="M56 30 L66 16 L76 30 L70 38 L62 36Z" fill="var(--leaf)" stroke="var(--leaf-d)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="36" cy="64" rx="5" ry="12" fill="#fff" opacity=".3" transform="rotate(60 36 64)"/>` },
  ],
};
// Every color can always be fed sweets; most also have real foods of that color.
const menu = key => [...(FOODS[key] || []), ...(FOODS[key] || []), ...SWEETS(key)];
const foodSVG = f => `<svg viewBox="0 0 100 100" aria-hidden="true">${f.svg}</svg>`;
const ICON = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  again: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>`,
};

/* ================= app ================= */
const app = document.getElementById('app');
let cleanup = null;
function show(fn) { if (cleanup) cleanup(); cleanup = null; try { speechSynthesis.cancel(); } catch (_) {} app.innerHTML = ''; fn(); }
function confetti(keys) {
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = `var(--${keys[i % keys.length]})`;
    c.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    c.style.animationDelay = Math.random() * .5 + 's';
    document.body.append(c); setTimeout(() => c.remove(), 3600);
  }
}

function home() {
  show(() => {
    const s = document.createElement('div'); s.className = 'screen home';
    s.innerHTML = `
      <h1>Монстрики</h1>
      <button class="start" id="go"><span class="pair">${monsterSVG('red')}${monsterSVG('blue')}</span><span>Играть</span></button>
      <p class="note">Пробная версия. Голос пока синтезированный, в приложении будет живая озвучка. Включите звук на телефоне.</p>`;
    app.append(s);
    s.querySelector('#go').onclick = () => { audio(); game(); };
  });
}

function game() {
  show(() => {
    let next = 4;                       // index in ORDER of the next newcomer
    const met = new Set(ORDER.slice(0, 4));
    const s = document.createElement('div'); s.className = 'screen';
    const bar = document.createElement('div'); bar.className = 'bar';
    bar.innerHTML = `<button class="round" id="back" aria-label="Назад">${ICON.back}</button><span class="spacer"></span>
      <div class="levels" id="met"></div><span class="spacer"></span>
      <button class="round" id="again" aria-label="Сначала">${ICON.again}</button>`;
    bar.querySelector('#back').onclick = home;
    bar.querySelector('#again').onclick = game;
    const metEl = bar.querySelector('#met');
    function drawMet(fresh) {
      metEl.innerHTML = ORDER.map(k => `<i class="${k === fresh ? 'now' : met.has(k) ? 'done' : ''}" style="--c:var(--${k})"></i>`).join('');
      metEl.setAttribute('aria-label', `Знакомых цветов: ${met.size} из ${ORDER.length}`);
    }
    drawMet();

    const grid = document.createElement('div'); grid.className = 'monsters';
    grid.style.setProperty('--cols', 2); grid.style.setProperty('--rows', 2);
    const tray = document.createElement('div'); tray.className = 'tray';
    s.append(bar, grid, tray); app.append(s);

    function makeMonster(key) {
      const m = document.createElement('div'); m.className = 'monster';
      setMonster(m, key); return m;
    }
    function setMonster(m, key) {
      m.dataset.color = key; m.eaten = 0;
      m.innerHTML = monsterSVG(key); m.setAttribute('aria-label', `${cap(COLORS[key].m)} монстрик`);
    }
    for (const key of shuffle(ORDER.slice(0, 4))) grid.append(makeMonster(key));
    const monsterEls = () => [...grid.children];
    const onScreen = () => monsterEls().map(m => m.dataset.color);

    // Tray: four foods; each refill picks the on-screen color with the fewest foods waiting.
    let selected = null, busy = false;
    const slots = [];
    for (let i = 0; i < 4; i++) { const c = document.createElement('div'); c.className = 'food'; tray.append(c); slots.push(c); }
    function pickFood() {
      const waiting = k => slots.filter(sl => sl.food && sl.food.color === k && !sl.classList.contains('gone')).length;
      const colors = shuffle(onScreen()).sort((a, b) => waiting(a) - waiting(b));
      const key = colors[0], options = menu(key);
      return { ...options[Math.floor(Math.random() * options.length)], color: key };
    }
    function fill(slot, f = pickFood()) {
      slot.food = f;
      slot.className = 'food'; void slot.offsetWidth; slot.classList.add('pop');
      slot.innerHTML = foodSVG(f);
      slot.setAttribute('aria-label', `${cap(COLORS[f.color][f.g])} ${f.name}`);
    }
    slots.forEach(sl => { sl.food = null; });
    slots.forEach(sl => fill(sl));
    const phrase = f => `${cap(COLORS[f.color][f.g])} ${f.name}`;

    function setMouths(open) { monsterEls().forEach(m => m.classList.toggle('open', open)); }
    function look(x, y) {
      monsterEls().forEach(m => {
        const r = m.querySelector('svg').getBoundingClientRect();
        m.querySelectorAll('.pupil').forEach(p => {
          if (x == null) { p.style.transform = ''; return; }
          const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2), len = Math.hypot(dx, dy) || 1, k = +p.dataset.r || 6;
          p.style.transform = `translate(${dx / len * k}px, ${dy / len * k}px)`;
        });
      });
    }
    function select(slot) {
      slots.forEach(c => c.classList.remove('selected'));
      selected = slot;
      if (slot) { slot.classList.add('selected'); setMouths(true); sfx.boing(); say(phrase(slot.food)); const r = slot.getBoundingClientRect(); look(r.left + r.width / 2, r.top); }
      else { setMouths(false); look(); }
    }
    function restart(m, cls, ms) { m.classList.remove(cls); void m.offsetWidth; m.classList.add(cls); setTimeout(() => m.classList.remove(cls), ms); }

    async function fly(fromRect, toEl, f) {
      const el = document.createElement('div'); el.className = 'floating'; el.innerHTML = foodSVG(f);
      document.body.append(el);
      const t = toEl.getBoundingClientRect();
      const a = [fromRect.left + fromRect.width / 2, fromRect.top + fromRect.height / 2], b = [t.left + t.width / 2, t.top + t.height / 2];
      await el.animate([
        { transform: `translate(${a[0]}px, ${a[1]}px) scale(1)` },
        { transform: `translate(${(a[0] + b[0]) / 2}px, ${Math.min(a[1], b[1]) - 60}px) scale(1.1)`, offset: .5 },
        { transform: `translate(${b[0]}px, ${b[1]}px) scale(.5)` },
      ], { duration: 420, easing: 'ease-in-out', fill: 'forwards' }).finished.catch(() => {});
      return el;
    }

    // A full monster waves goodbye and leaves; the next color takes its place.
    async function swap(m) {
      const old = m.dataset.color;
      say('Спасибо! Пока-пока!');
      restart(m, 'wave', 1050);
      await wait(1100);
      m.classList.add('leave'); tone(600, .4, { to: 200, vol: .12 });
      await wait(700);
      const free = ORDER.filter(k => !onScreen().includes(k));
      let key;
      if (next < ORDER.length) key = ORDER[next++];
      else key = free.filter(k => k !== old)[Math.floor(Math.random() * (free.length - 1))] || free[0];
      const fresh = !met.has(key);
      met.add(key);
      m.classList.remove('leave');
      setMonster(m, key);
      restart(m, 'enter', 750);
      drawMet(fresh ? key : null);
      // Foods only the departed monster could eat now feed the newcomer.
      slots.forEach(sl => { if (sl.food && sl.food.color === old) fill(sl, (() => { const o = menu(key); return { ...o[Math.floor(Math.random() * o.length)], color: key }; })()); });
      await wait(450);
      restart(m, 'clap', 950); sfx.clap(2);
      say(fresh ? `Привет! Я новенький! Я ${COLORS[key].m}!` : `Привет! Я ${COLORS[key].m}!`);
      if (fresh && met.size === ORDER.length) {
        await wait(1800);
        monsterEls().forEach(x => x.classList.add('dance')); sfx.win(); sfx.clap(4); confetti(ORDER);
        say('Ура! Ты знаешь все цвета!');
        await wait(3000); monsterEls().forEach(x => x.classList.remove('dance'));
      }
    }

    async function feed(slot, monster, fromRect) {
      if (busy || !slot.food) return; busy = true;
      const f = slot.food, want = monster.dataset.color;
      slots.forEach(c => c.classList.remove('selected')); selected = null;
      slot.classList.add('gone');
      monsterEls().forEach(m => m.classList.remove('open')); monster.classList.add('open');
      const el = await fly(fromRect || slot.getBoundingClientRect(), monster.querySelector('.mouth-target'), f);
      monster.classList.remove('open'); look();
      if (f.color === want) {
        el.remove();
        monster.classList.add('chomp'); sfx.chomp();
        say(`Ням! ${phrase(f)}!`);
        monster.eaten++;
        await wait(500); monster.classList.remove('chomp');
        monster.querySelector('svg').style.transform = `scale(${1 + monster.eaten * .06})`;
        restart(monster, 'clap', 950); sfx.clap(2);
        await wait(1000);
        fill(slot);
        if (monster.eaten >= HUNGER) { monster.querySelector('svg').style.transform = ''; await swap(monster); }
      } else {
        monster.classList.add('yuck'); sfx.yuck();
        say(`Фу! ${phrase(f)} — ${COLORS[f.color].dat}!`);
        const back = slot.getBoundingClientRect(), m = monster.querySelector('.mouth-target').getBoundingClientRect();
        await el.animate([
          { transform: `translate(${m.left}px, ${m.top}px) scale(.5)` },
          { transform: `translate(${(m.left + back.left) / 2 + 30}px, ${Math.min(m.top, back.top) - 80}px) scale(1.1) rotate(200deg)`, offset: .5 },
          { transform: `translate(${back.left + back.width / 2}px, ${back.top + back.height / 2}px) scale(1) rotate(360deg)` },
        ], { duration: 650, easing: 'ease-in-out', fill: 'forwards' }).finished.catch(() => {});
        el.remove(); slot.classList.remove('gone');
        await wait(250); monster.classList.remove('yuck');
      }
      busy = false;
    }

    // Drag a food onto a monster, or tap a food and then a monster.
    let drag = null;
    tray.addEventListener('pointerdown', e => {
      const slot = e.target.closest('.food'); if (!slot || !slot.food || slot.classList.contains('gone') || busy) return;
      e.preventDefault(); audio();
      drag = { slot, x: e.clientX, y: e.clientY, moved: false, el: null, id: e.pointerId };
      tray.setPointerCapture(e.pointerId);
    });
    tray.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) {
        drag.moved = true;
        drag.el = document.createElement('div'); drag.el.className = 'floating'; drag.el.innerHTML = foodSVG(drag.slot.food);
        document.body.append(drag.el); drag.slot.classList.add('gone'); drag.slot.classList.remove('selected'); selected = null; setMouths(true);
      }
      if (drag.moved) { drag.el.style.transform = `translate(${e.clientX}px, ${e.clientY}px) scale(1.15)`; look(e.clientX, e.clientY); }
    });
    const endDrag = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag; drag = null;
      if (!d.moved) { select(selected === d.slot ? null : d.slot); return; }
      const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.monster');
      const rect = d.el.getBoundingClientRect(); d.el.remove(); d.slot.classList.remove('gone');
      setMouths(false);
      if (under) feed(d.slot, under, rect); else look();
    };
    tray.addEventListener('pointerup', endDrag);
    tray.addEventListener('pointercancel', endDrag);
    grid.addEventListener('click', e => {
      const m = e.target.closest('.monster'); if (!m || busy) return; audio();
      if (selected) { feed(selected, m); return; }
      restart(m, 'giggle', 650); sfx.boing(); say(`Я ${COLORS[m.dataset.color].m}!`);
    });
    cleanup = () => document.querySelectorAll('.floating').forEach(f => f.remove());
    setTimeout(() => say('Покорми монстриков! Красный ест красное, синий — синее.'), 400);
  });
}

home();
</script>
