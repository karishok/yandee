<meta charset="utf-8">
<title>Монстрики</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-height play screen (start → game, plus a gallery of every picture), big targets, no scrolling in the game.
   Style: painted storybook pictures like the scenes — a warm kitchen wall, a wooden tray on the table.
   One deliberate light look, like the app itself. */
:root {
  color-scheme: light;
  --paper: #fff8f0;
  --card: #fff0e1;
  --card-strong: #ffe6cd;
  --stitch: #e3c39c;
  --line: #f1e1cf;
  --ink: #2b211a;
  --muted: #76675a;
  --accent: #ef7b33;
  --sun: #ffe39a;
  --mint: #d3eddd;
  --sky: #d9eaf7;
  --dot: #f6e0c8;
  --shadow: rgba(84, 52, 16, .14);
  --shadow-strong: rgba(84, 52, 16, .26);
  --display: "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: url(img/background.webp) center bottom / cover no-repeat, var(--paper); color: var(--ink); font-family: var(--display);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.app {
  height: 100%; display: flex; flex-direction: column; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* ---------- start ---------- */
.home { justify-content: center; align-items: center; gap: 18px; }
.home h1 { margin: 0; font-size: clamp(32px, 9vw, 46px); font-weight: 900; letter-spacing: -.02em; text-align: center; }
.start {
  border: 0; border-radius: 32px; padding: 18px 18px 22px; width: min(320px, 100%);
  background: var(--card); color: var(--ink); font: 900 26px/1.1 var(--display);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  box-shadow: 0 14px 34px var(--shadow); cursor: pointer;
}
.start:active { transform: translateY(3px); }
.start .pair { display: flex; width: 100%; }
.start .pair .fig { flex: 1; min-width: 0; aspect-ratio: 1; }
.link {
  border: 0; background: var(--card-strong); color: var(--ink); border-radius: 999px;
  padding: 10px 20px; font: 800 16px/1.2 var(--display); cursor: pointer;
  box-shadow: inset 0 0 0 2px var(--stitch);
}
.start:focus-visible, .round:focus-visible, .link:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
.note { max-width: 44ch; margin: 0; text-align: center; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.4; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; flex: none; }
.round {
  width: 56px; height: 56px; border-radius: 50%; border: 0; flex: none;
  background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 6px 16px var(--shadow);
}
.round:active { transform: translateY(2px); }
.round svg { width: 28px; height: 28px; }
.met { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 3px; }
.met svg { width: 22px; height: 22px; transition: transform .3s; }
.met svg.now { transform: scale(1.4); }

/* ---------- stage: a paper card with soft painted blobs, like the site's hero ---------- */
.stage {
  flex: 1; min-height: 0; position: relative;
}
.monsters { position: absolute; inset: 6px; display: flex; flex-wrap: wrap; align-content: center; }
.monster {
  width: 50%; height: 50%; display: grid; place-items: center; cursor: pointer; touch-action: none;
  box-sizing: border-box; padding: 4px; container-type: size;
}
.fig { position: relative; transform-origin: 50% 91%; transition: transform .3s; }
.monster .fig { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
.fig img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
/* Arms hang at the sides, in front of the fur; they turn at the shoulder. */
.arm { position: absolute; top: 42%; width: 42%; height: 42%; transform-origin: 50% 10%; }
.arm-l { left: -4%; rotate: 10deg; }
.arm-r { left: 62%; rotate: -10deg; }
.arm-r img { transform: scaleX(-1); }
.mouth-target { position: absolute; left: 50%; top: 46%; width: 1px; height: 1px; }
.monster.enter .fig { animation: enter .7s cubic-bezier(.3,1.6,.5,1); }
.face { display: none; }
.f-idle { display: block; }
.open .f-idle, .chomp .f-idle, .yuck .f-idle { display: none; }
.open .f-open { display: block; }
.chomp .f-open, .yuck .f-open { display: none; }
.chomp .f-chomp, .yuck .f-yuck { display: block; }
.monster.chomp .fig { animation: chomp .45s ease; }
.monster.yuck .fig { animation: shake .5s ease; }
.monster.giggle .fig { animation: wobble .6s ease; }
.monster.dance .fig { animation: dance .5s ease-in-out infinite alternate; }
.monster:nth-child(2n).dance .fig { animation-delay: .2s; }
.monster.clap .arm-l { animation: clap-l .9s ease-in-out; }
.monster.clap .arm-r { animation: clap-r .9s ease-in-out; }
.monster.dance .arm-l { animation: clap-l .9s ease-in-out infinite; }
.monster.dance .arm-r { animation: clap-r .9s ease-in-out infinite; }
.monster.wave .arm-r { animation: wave 1.1s ease-in-out; }
.monster.leave .fig { animation: leave .7s ease-in forwards; }

/* ---------- tray: the painted wooden tray on the table ---------- */
.tray {
  flex: none; height: clamp(96px, 17vh, 132px);
  background: url(img/tray.webp) center 80% / 100% 70% no-repeat;
  display: flex; align-items: center; justify-content: space-around; padding: 0 18px 8px;
}
.food { width: 21%; max-width: 92px; aspect-ratio: 1; display: grid; place-items: center; cursor: grab; touch-action: none; transition: transform .2s, opacity .2s; }
.food img, .floating img { width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; filter: drop-shadow(0 5px 5px rgba(84,52,16,.22)); }
.food.selected { animation: bob .6s ease-in-out infinite alternate; }
.food.gone { opacity: 0; pointer-events: none; }
.food.pop { animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
.floating { position: fixed; z-index: 50; pointer-events: none; width: 84px; height: 84px; margin: -42px 0 0 -42px; left: 0; top: 0; }
.floating img { filter: drop-shadow(0 14px 10px var(--shadow-strong)); }

.confetti { position: fixed; top: -24px; width: 14px; height: 18px; border-radius: 4px; z-index: 60; pointer-events: none; }
.confetti.dot { width: 14px; height: 14px; border-radius: 50%; }

/* ---------- gallery ---------- */
.gallery { overflow-y: auto; padding-bottom: 24px; -webkit-overflow-scrolling: touch; }
.gallery h2 { margin: 6px 0 0; font-size: 22px; font-weight: 900; }
.gallery p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 700; }
.g-monsters { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.g-monsters button { border: 0; background: var(--card); border-radius: 22px; padding: 8px 6px 6px; cursor: pointer; font: 800 13px/1.2 var(--display); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 6px 16px var(--shadow); }
.g-monsters .fig { width: 100%; aspect-ratio: 1; }
.g-color { background: var(--card); border-radius: 22px; padding: 10px 12px 12px; box-shadow: 0 6px 16px var(--shadow); }
.g-color h3 { margin: 0 0 6px; font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.g-color h3 svg { width: 20px; height: 20px; }
.g-foods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.g-foods figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--muted); text-align: center; }
.g-foods img { width: 100%; max-width: 72px; height: auto; filter: drop-shadow(0 4px 4px rgba(84,52,16,.2)); }

@keyframes chomp { 0%{transform:scale(1)} 30%{transform:scale(1.12,.9)} 60%{transform:scale(.95,1.08)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px) rotate(-3deg)} 40%{transform:translateX(8px) rotate(3deg)} 60%{transform:translateX(-6px)} 80%{transform:translateX(5px)} }
@keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }
@keyframes dance { from{transform:translateY(0) rotate(-4deg)} to{transform:translateY(-14px) rotate(4deg)} }
@keyframes enter { from{transform:scale(0) rotate(-20deg)} to{transform:scale(1) rotate(0)} }
@keyframes bob { from{transform:translateY(-6px) scale(1.15)} to{transform:translateY(-14px) scale(1.15)} }
@keyframes pop { from{transform:scale(.3)} to{transform:scale(1)} }
/* Mittens slide together in front of the belly and back, twice. */
@keyframes clap-l { 0%,100%{transform:rotate(0)} 22%,62%{transform:rotate(-72deg)} 42%,82%{transform:rotate(-54deg)} }
@keyframes clap-r { 0%,100%{transform:rotate(0)} 22%,62%{transform:rotate(72deg)} 42%,82%{transform:rotate(54deg)} }
@keyframes wave { 0%,100%{transform:rotate(0)} 20%,60%{transform:rotate(-150deg)} 40%,80%{transform:rotate(-118deg)} }
@keyframes leave { 0%{transform:scale(1)} 30%{transform:translateY(-14px) scale(1.05)} 100%{transform:translateY(40px) scale(0) rotate(25deg); opacity:0} }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div class="app" id="app"></div>

<script>
'use strict';
/* ================= colours ================= */
// Toy paint, warm like the scenes (the same paint as "Фигурки").
const PAINT = {
  red: '#e2553f', blue: '#3f8fd8', yellow: '#f6c447', green: '#5daa4f', orange: '#f08a3a', purple: '#9a6cc9',
  pink: '#ef8fb0', brown: '#a8703f', lightblue: '#7cc6e8', white: '#f7f1e6', black: '#3d3530',
};
const LEAF = '#6aa84f', STEM = '#8a5a33', CONE = '#e0b06a', HORN = '#f3dfc0', STICK = '#f6ecd8';
const INK = '#2b211a', MOUTH = '#6b2a2a', TONGUE = '#ef7f86', EYE = '#fffdf7';

function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t).toString(16).padStart(2, '0');
  return '#' + ch(16) + ch(8) + ch(0);
}
// A painted toy: light from above, a darker edge below, a warm dark outline.
function shades(hex) {
  const lift = hex === PAINT.black ? .2 : .38;
  const side = mix(hex, '#3b2410', .32);
  return { fill: hex, light: mix(hex, '#fff8ec', lift), side, low: mix(hex, side, .45), line: mix(hex, '#3b2410', hex === PAINT.black ? .45 : .62) };
}

// Each picture gets its own gradient ids (ids are shared by the whole page).
let uid = 0;
function painter() {
  const id = 'p' + (uid++), defs = [], grads = {};
  const grad = hex => {
    if (!grads[hex]) {
      const k = shades(hex), gid = `${id}g${Object.keys(grads).length}`;
      defs.push(`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${k.light}"/><stop offset=".55" stop-color="${hex}"/><stop offset="1" stop-color="${k.low}"/></linearGradient>`);
      grads[hex] = gid;
    }
    return `url(#${grads[hex]})`;
  };
  return {
    id,
    grad,
    paint: (hex, w = 4) => `fill="${grad(hex)}" stroke="${shades(hex).line}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`,
    line: hex => shades(hex).line,
    shine: (cx, cy, rx, ry, rot = 0, op = 1) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${id}sh)" opacity="${op}"${rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : ''}/>`,
    defs: (extra = '') => `<defs>${defs.join('')}<radialGradient id="${id}sh"><stop offset="0" stop-color="#fffdf6" stop-opacity=".9"/><stop offset="1" stop-color="#fffdf6" stop-opacity="0"/></radialGradient>${extra}</defs>`,
  };
}

/* Colours with every word form the voice needs: adjective by gender (m/f/n) and "to the … one" (dat). */
const COLORS = {
  red:       { m: 'красный',    f: 'красная',    n: 'красное',    dat: 'красному',    look: 0 },
  blue:      { m: 'синий',      f: 'синяя',      n: 'синее',      dat: 'синему',      look: 2 },
  yellow:    { m: 'жёлтый',     f: 'жёлтая',     n: 'жёлтое',     dat: 'жёлтому',     look: 1 },
  green:     { m: 'зелёный',    f: 'зелёная',    n: 'зелёное',    dat: 'зелёному',    look: 3 },
  orange:    { m: 'оранжевый',  f: 'оранжевая',  n: 'оранжевое',  dat: 'оранжевому',  look: 1 },
  purple:    { m: 'фиолетовый', f: 'фиолетовая', n: 'фиолетовое', dat: 'фиолетовому', look: 0 },
  pink:      { m: 'розовый',    f: 'розовая',    n: 'розовое',    dat: 'розовому',    look: 3 },
  brown:     { m: 'коричневый', f: 'коричневая', n: 'коричневое', dat: 'коричневому', look: 2 },
  lightblue: { m: 'голубой',    f: 'голубая',    n: 'голубое',    dat: 'голубому',    look: 0 },
  white:     { m: 'белый',      f: 'белая',      n: 'белое',      dat: 'белому',      look: 1 },
  black:     { m: 'чёрный',     f: 'чёрная',     n: 'чёрное',     dat: 'чёрному',     look: 3 },
};
const ORDER = ['red', 'blue', 'yellow', 'green', 'orange', 'purple', 'pink', 'brown', 'lightblue', 'white', 'black'];
const HUNGER = 2;
const cap = s => s[0].toUpperCase() + s.slice(1);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ================= monsters ================= */
// Painted pictures (made in ChatGPT): four faces per monster and one arm, mirrored for the other side.
const FACES = ['idle', 'open', 'chomp', 'yuck'];
function monsterSVG(key) {
  const src = s => `img/${key}_${s}.webp`;
  return `<div class="fig">` +
    FACES.map(s => `<img class="face f-${s}" src="${src(s)}" alt="" draggable="false">`).join('') +
    `<div class="arm arm-l"><img src="${src('arm')}" alt="" draggable="false"></div>` +
    `<div class="arm arm-r"><img src="${src('arm')}" alt="" draggable="false"></div>` +
    `<i class="mouth-target"></i></div>`;
}
// Load every picture up front, so a face never blinks while it changes.
for (const k of ['red', 'blue', 'yellow', 'green', 'orange', 'purple', 'pink', 'brown', 'lightblue', 'white', 'black'])
  for (const s of [...FACES, 'arm']) new Image().src = `img/${k}_${s}.webp`;

/* ================= food ================= */

// [picture, noun, gender] per colour — the same menu as the app.
const FOODS = {
  red: [['strawberry', 'клубника', 'f'], ['tomato', 'помидор', 'm'], ['apple', 'яблоко', 'n'], ['cherry', 'вишня', 'f']],
  blue: [['blueberry', 'черника', 'f'], ['plum', 'слива', 'f'], ['candy', 'конфета', 'f']],
  yellow: [['banana', 'банан', 'm'], ['cheese', 'сыр', 'm'], ['lemon', 'лимон', 'm'], ['corn', 'кукуруза', 'f']],
  green: [['cucumber', 'огурец', 'm'], ['pear', 'груша', 'f'], ['peas', 'горошек', 'm'], ['broccoli', 'брокколи', 'f']],
  orange: [['orangeFruit', 'апельсин', 'm'], ['carrot', 'морковка', 'f'], ['pumpkin', 'тыква', 'f'], ['mandarin', 'мандарин', 'm']],
  purple: [['grapes', 'виноград', 'm'], ['eggplant', 'баклажан', 'm'], ['lollipop', 'леденец', 'm']],
  pink: [['donut', 'пончик', 'm'], ['marshmallow', 'зефир', 'm'], ['cottonCandy', 'сахарная вата', 'f'], ['iceCream', 'мороженое', 'n']],
  brown: [['chocolate', 'шоколадка', 'f'], ['cookie', 'печенье', 'n'], ['nut', 'орех', 'm'], ['mushroom', 'гриб', 'm']],
  lightblue: [['bogBlueberry', 'голубика', 'f'], ['fish', 'рыбка', 'f'], ['iceCube', 'льдинка', 'f'], ['water', 'вода', 'f']],
  white: [['egg', 'яйцо', 'n'], ['milk', 'молоко', 'n'], ['rice', 'рис', 'm'], ['garlic', 'чеснок', 'm']],
  black: [['blackberry', 'ежевика', 'f'], ['olive', 'оливка', 'f'], ['bread', 'хлеб', 'm'], ['currant', 'смородина', 'f']],
};
const foodsOf = color => FOODS[color].map(([kind, name, g]) => ({ kind, name, g, color }));
const fileId = kind => kind.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
function foodSVG(f) { return `<img src="img/${f.color}_${fileId(f.kind)}.webp" alt="" draggable="false">`; }
const foodName = f => `${cap(COLORS[f.color][f.g])} ${f.name}`;

// A met colour in the top bar: a painted dot; a dashed ring before it is met.
function dotSVG(key, met, now) {
  const p = painter(), k = shades(PAINT[key]);
  const body = met ? `<circle cx="14" cy="14" r="9" ${p.paint(PAINT[key], 2.5)}/>` + p.shine(11, 10, 4, 3)
                   : `<circle cx="14" cy="14" r="8" fill="none" stroke="#dcc2a2" stroke-width="2.5" stroke-dasharray="3 3"/>`;
  return `<svg viewBox="0 0 28 28" class="${now ? 'now' : ''}" aria-hidden="true">${p.defs()}${body}</svg>`;
}

const ICON = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  again: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>`,
};

/* ================= voice & sound ================= */
// Like the app: a line is never cut off; of the lines asked for meanwhile, only the latest is said next.
let ruVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    ruVoice = vs.find(v => /^ru/i.test(v.lang) && /Milena|Alena|female|жен/i.test(v.name)) || vs.find(v => /^ru/i.test(v.lang)) || null;
  } catch (_) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (_) {}
let speaking = false, waiting = null;
function say(text) {
  return new Promise(done => {
    if (speaking) { if (waiting) waiting.done(); waiting = { text, done }; return; }
    speak(text, done);
  });
}
function speak(text, done) {
  speaking = true;
  let finished = false;
  const finish = () => {
    if (finished) return; finished = true; speaking = false; done();
    if (waiting) { const w = waiting; waiting = null; speak(w.text, w.done); }
  };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; if (ruVoice) u.voice = ruVoice;
    u.rate = 0.92; u.pitch = 1.25;
    u.onend = finish; u.onerror = finish;
    speechSynthesis.speak(u);
  } catch (_) { finish(); return; }
  setTimeout(finish, 600 + text.length * 110);
}
function hush() { waiting = null; try { speechSynthesis.cancel(); } catch (_) {} speaking = false; }
const heard = (promise, ms = 4000) => Promise.race([promise, wait(ms)]);

let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, { type = 'sine', to = null, vol = 0.18, delay = 0 } = {}) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, delay = 0, vol = 0.25, freq = 900, type = 'bandpass') {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
  f.type = type; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const sfx = {
  chomp() { noise(.08, 0); noise(.08, .14); noise(.08, .28); },
  clap(times = 2) { for (let i = 0; i < times; i++) noise(.09, .2 + i * .36, .55, 1800, 'highpass'); },
  yuck() { tone(220, .35, { type: 'triangle', to: 110, vol: .2 }); tone(180, .3, { type: 'triangle', to: 90, vol: .12, delay: .1 }); },
  boing() { tone(300, .25, { to: 700 }); },
  leave() { tone(600, .4, { to: 200, vol: .12 }); },
  pop() { tone(500, .12, { to: 900, vol: .14 }); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .3, { type: 'triangle', vol: .14, delay: i * .13 })); },
};

/* ================= screens ================= */
const app = document.getElementById('app');
let cleanup = null, session = 0;
function show(fn) { if (cleanup) cleanup(); cleanup = null; session++; hush(); app.innerHTML = ''; fn(); }
function restart(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }

function confetti() {
  for (let i = 0; i < 44; i++) {
    const c = document.createElement('i');
    c.className = 'confetti' + (i % 3 === 0 ? ' dot' : '');
    c.style.left = Math.random() * 100 + 'vw';
    const hex = PAINT[ORDER[i % ORDER.length]];
    c.style.background = `linear-gradient(${shades(hex).light}, ${hex})`;
    c.style.boxShadow = `inset 0 0 0 1.5px ${shades(hex).line}`;
    document.body.append(c);
    c.animate([{ transform: 'translateY(0) rotate(0)' }, { transform: `translate(${(Math.random() - .5) * 120}px, ${innerHeight + 60}px) rotate(${Math.random() * 720}deg)` }],
      { duration: 1600 + Math.random() * 1200, delay: Math.random() * 400, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'forwards' })
      .finished.then(() => c.remove());
  }
}

function home() {
  show(() => {
    const s = document.createElement('div'); s.className = 'screen home';
    s.innerHTML = `
      <h1>Монстрики</h1>
      <button class="start" id="go"><span class="pair">${monsterSVG('red')}${monsterSVG('blue')}</span><span>Играть</span></button>
      <button class="link" id="all">Все монстрики и еда</button>
      <p class="note">Пробная версия с новыми картинками. Голос здесь компьютерный, в приложении — твой. Включите звук на телефоне.</p>`;
    app.append(s);
    s.querySelector('#go').onclick = () => { audio(); game(); };
    s.querySelector('#all').onclick = gallery;
  });
}

function gallery() {
  show(() => {
    const s = document.createElement('div'); s.className = 'screen gallery';
    const faces = ['', 'open', 'chomp', 'yuck'];
    s.innerHTML = `
      <div class="bar"><button class="round" id="back" aria-label="Назад">${ICON.back}</button><h2>Все рисунки</h2></div>
      <p>Нажми на монстрика — он покажет другое лицо.</p>
      <div class="g-monsters">${ORDER.map(k => `<button data-k="${k}" data-f="0">${monsterSVG(k)}<span>${cap(COLORS[k].m)}</span></button>`).join('')}</div>
      ${ORDER.map(k => `<section class="g-color"><h3>${dotSVG(k, true)}${cap(COLORS[k].m)} ест</h3><div class="g-foods">${foodsOf(k).map(f => `<figure>${foodSVG(f)}<figcaption>${f.name}</figcaption></figure>`).join('')}</div></section>`).join('')}`;
    app.append(s);
    s.querySelector('#back').onclick = home;
    s.querySelectorAll('.g-monsters button').forEach(b => b.onclick = () => {
      b.dataset.f = (+b.dataset.f + 1) % faces.length;
      faces.forEach(f => f && b.classList.remove(f));
      if (faces[b.dataset.f]) b.classList.add(faces[b.dataset.f]);
    });
  });
}

function game() {
  show(() => {
    const my = session;
    const alive = () => my === session;
    let next = 4, firstMeetings = 0;
    const met = new Set(ORDER.slice(0, 4));
    const lastEaten = {};
    const s = document.createElement('div'); s.className = 'screen';
    s.innerHTML = `
      <div class="bar"><button class="round" id="back" aria-label="Назад">${ICON.back}</button>
        <div class="met" id="met"></div>
        <button class="round" id="again" aria-label="Сначала">${ICON.again}</button></div>
      <div class="stage"><div class="monsters" id="grid"></div></div>
      <div class="tray" id="tray"></div>`;
    app.append(s);
    s.querySelector('#back').onclick = home;
    s.querySelector('#again').onclick = game;
    const metEl = s.querySelector('#met'), grid = s.querySelector('#grid'), tray = s.querySelector('#tray');
    function drawMet(fresh) {
      metEl.innerHTML = ORDER.map(k => dotSVG(k, met.has(k), k === fresh)).join('');
      metEl.setAttribute('aria-label', `Знакомых цветов: ${met.size} из ${ORDER.length}`);
      if (fresh) setTimeout(() => metEl.querySelector('.now')?.classList.remove('now'), 1400);
    }
    drawMet();

    function setMonster(m, key) {
      m.dataset.color = key; m.eaten = 0;
      m.innerHTML = monsterSVG(key); m.setAttribute('aria-label', `${cap(COLORS[key].m)} монстрик`);
    }
    for (const key of shuffle(ORDER.slice(0, 4))) { const m = document.createElement('div'); m.className = 'monster'; setMonster(m, key); grid.append(m); }
    const monsterEls = () => [...grid.children];
    const onScreen = () => monsterEls().map(m => m.dataset.color);
    const fig = m => m.querySelector('.fig');

    // Tray: four treats; each refill feeds the on-screen colour with the fewest treats waiting,
    // never a treat already in the tray and never the one of that colour just eaten.
    let selected = null, busy = false;
    const slots = [];
    for (let i = 0; i < 4; i++) { const c = document.createElement('div'); c.className = 'food'; tray.append(c); slots.push(c); c.food = null; }
    function foodFor(color) {
      const inTray = slots.map(sl => sl.food).filter(Boolean).map(f => f.kind);
      const all = foodsOf(color);
      const fresh = all.filter(f => !inTray.includes(f.kind) && f.kind !== lastEaten[color]);
      return pick(fresh.length ? fresh : all.filter(f => !inTray.includes(f.kind)).length ? all.filter(f => !inTray.includes(f.kind)) : all);
    }
    function pickFood() {
      const waitingFor = k => slots.filter(sl => sl.food && sl.food.color === k).length;
      const colors = shuffle(onScreen()).sort((a, b) => waitingFor(a) - waitingFor(b));
      return foodFor(colors[0]);
    }
    function fill(slot, f) {
      slot.food = null; slot.food = f || pickFood();
      slot.className = 'food'; void slot.offsetWidth; slot.classList.add('pop');
      slot.innerHTML = foodSVG(slot.food);
      slot.setAttribute('aria-label', foodName(slot.food));
    }
    slots.forEach(sl => fill(sl));

    function setMouths(open) { monsterEls().forEach(m => m.classList.toggle('open', open)); }
    function look() {} // the eyes are part of the picture now
    function select(slot) {
      slots.forEach(c => c.classList.remove('selected'));
      selected = slot;
      if (slot) { slot.classList.add('selected'); setMouths(true); sfx.boing(); say(foodName(slot.food)); const r = slot.getBoundingClientRect(); look(r.left + r.width / 2, r.top); }
      else { setMouths(false); look(); }
    }

    async function fly(fromRect, toEl, f) {
      const el = document.createElement('div'); el.className = 'floating'; el.innerHTML = foodSVG(f);
      document.body.append(el);
      const t = toEl.getBoundingClientRect();
      const a = [fromRect.left + fromRect.width / 2, fromRect.top + fromRect.height / 2], b = [t.left + t.width / 2, t.top + t.height / 2];
      await el.animate([
        { transform: `translate(${a[0]}px, ${a[1]}px) scale(1)` },
        { transform: `translate(${(a[0] + b[0]) / 2}px, ${Math.min(a[1], b[1]) - 60}px) scale(1.1)`, offset: .5 },
        { transform: `translate(${b[0]}px, ${b[1]}px) scale(.5)` },
      ], { duration: 420, easing: 'ease-in-out', fill: 'forwards' }).finished.catch(() => {});
      return el;
    }

    // Wiggle while the monster is still talking, so the picture never runs ahead of the voice.
    async function wiggleUntil(speech, m) {
      let done = false; heard(speech).then(() => { done = true; });
      while (!done && alive()) { restart(m, 'giggle', 650); await wait(600); }
    }

    // A full monster thanks, waves and leaves; the next colour takes its seat.
    async function swap(m, yum) {
      await wiggleUntil(yum, m); if (!alive()) return;
      fig(m).style.transform = '';
      const bye = say('Спасибо! Пока-пока!');
      restart(m, 'wave', 1150);
      await wait(1100); if (!alive()) return;
      m.classList.add('leave'); sfx.leave();
      await Promise.all([wait(700), heard(bye, 2500)]); if (!alive()) return;
      const old = m.dataset.color;
      let key;
      if (next < ORDER.length) key = ORDER[next++];
      else key = pick(ORDER.filter(k => !onScreen().includes(k)));
      const fresh = !met.has(key);
      met.add(key);
      if (fresh) firstMeetings++;
      m.classList.remove('leave');
      setMonster(m, key);
      restart(m, 'enter', 750); sfx.pop();
      drawMet(fresh ? key : null);
      slots.forEach(sl => { if (sl.food && sl.food.color === old) fill(sl, foodFor(key)); });
      const hello = say(fresh && firstMeetings % 2 === 1 ? `Привет! Я новенький! Я ${COLORS[key].m}!` : `Привет! Я ${COLORS[key].m}!`);
      await wait(450); if (!alive()) return;
      restart(m, 'clap', 950); sfx.clap(2);
      if (fresh && met.size === ORDER.length) {
        await heard(hello, 3000); if (!alive()) return;
        monsterEls().forEach(x => x.classList.add('dance')); sfx.win(); sfx.clap(4); confetti();
        await heard(say('Ура! Ты знаешь все цвета!'), 3500);
        await wait(800); monsterEls().forEach(x => x.classList.remove('dance'));
      }
    }

    async function feed(slot, monster, fromRect) {
      if (busy || !slot.food) return; busy = true;
      const f = slot.food, want = monster.dataset.color;
      slots.forEach(c => c.classList.remove('selected')); selected = null;
      slot.classList.add('gone');
      monsterEls().forEach(m => m.classList.remove('open')); monster.classList.add('open');
      const el = await fly(fromRect || slot.getBoundingClientRect(), monster.querySelector('.mouth-target'), f);
      monster.classList.remove('open'); look();
      if (!alive()) { el.remove(); return; }
      if (f.color === want) {
        el.remove();
        monster.classList.add('chomp'); sfx.chomp();
        const yum = say(`Ням! ${foodName(f)}`);
        monster.eaten++; lastEaten[f.color] = f.kind;
        slot.food = null;
        await wait(500); monster.classList.remove('chomp');
        fig(monster).style.transform = `scale(${1 + monster.eaten * .06})`;
        restart(monster, 'clap', 950); sfx.clap(2);
        await wait(1000); if (!alive()) return;
        fill(slot);
        if (monster.eaten >= HUNGER) await swap(monster, yum);
        else await wiggleUntil(yum, monster);
      } else {
        monster.classList.add('yuck'); sfx.yuck();
        const no = say(`Фу! ${foodName(f)} — ${COLORS[f.color].dat}!`);
        const back = slot.getBoundingClientRect(), mt = monster.querySelector('.mouth-target').getBoundingClientRect();
        await el.animate([
          { transform: `translate(${mt.left}px, ${mt.top}px) scale(.5)` },
          { transform: `translate(${(mt.left + back.left) / 2 + 30}px, ${Math.min(mt.top, back.top) - 80}px) scale(1.1) rotate(200deg)`, offset: .5 },
          { transform: `translate(${back.left + back.width / 2}px, ${back.top + back.height / 2}px) scale(1) rotate(360deg)` },
        ], { duration: 650, easing: 'ease-in-out', fill: 'forwards' }).finished.catch(() => {});
        el.remove(); slot.classList.remove('gone');
        await Promise.all([wait(250), heard(no)]);
        monster.classList.remove('yuck');
      }
      if (alive()) busy = false;
    }

    // Drag a treat onto a monster, or tap a treat and then a monster.
    let drag = null;
    tray.addEventListener('pointerdown', e => {
      const slot = e.target.closest('.food'); if (!slot || !slot.food || slot.classList.contains('gone') || busy) return;
      e.preventDefault(); audio();
      drag = { slot, x: e.clientX, y: e.clientY, moved: false, el: null, id: e.pointerId };
      tray.setPointerCapture(e.pointerId);
    });
    tray.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) {
        drag.moved = true;
        drag.el = document.createElement('div'); drag.el.className = 'floating'; drag.el.innerHTML = foodSVG(drag.slot.food);
        document.body.append(drag.el); drag.slot.classList.add('gone'); drag.slot.classList.remove('selected'); selected = null; setMouths(true);
      }
      if (drag.moved) { drag.el.style.transform = `translate(${e.clientX}px, ${e.clientY}px) scale(1.15)`; look(e.clientX, e.clientY); }
    });
    const endDrag = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag; drag = null;
      if (!d.moved) { select(selected === d.slot ? null : d.slot); return; }
      const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.monster');
      const rect = d.el.getBoundingClientRect(); d.el.remove(); d.slot.classList.remove('gone');
      setMouths(false);
      if (under) feed(d.slot, under, rect); else look();
    };
    tray.addEventListener('pointerup', endDrag);
    tray.addEventListener('pointercancel', endDrag);
    grid.addEventListener('click', e => {
      const m = e.target.closest('.monster'); if (!m || busy) return; audio();
      if (selected) { feed(selected, m); return; }
      restart(m, 'giggle', 650); sfx.boing(); say(`Я ${COLORS[m.dataset.color].m}!`);
    });
    cleanup = () => document.querySelectorAll('.floating, .confetti').forEach(f => f.remove());
    setTimeout(() => { if (alive()) say('Покорми монстриков! Красный ест красное, синий — синее.'); }, 400);
  });
}

home();
</script>
