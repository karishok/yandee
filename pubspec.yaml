name: yandee
description: "Yandee — интерактивные обучающие сцены для детей 1–3 лет"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/system/
    - assets/demo_content/home/
    - assets/demo_content/kitchen/
    - assets/demo_content/farm/
    - assets/demo_content/street/
    - assets/demo_content/bathroom/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFF3E3"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
