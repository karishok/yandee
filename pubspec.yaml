name: yandee
description: "Yandee — интерактивные обучающие сцены для детей 1–3 лет"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/system/
    - assets/demo_content/demo/
